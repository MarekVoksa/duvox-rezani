<title>Duvox Řezání</title>
<meta name="theme-color" content="#040459">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rokkitt:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: Duvox look (navy ground, cream panels, red + indigo 37° slants, Rokkitt). One column, sticky navy header, tab bar at the bottom on phones. Single committed light-on-navy look. */
:root {
  --navy: #040459; --navy-deep: #070746; --cream: #f9f6ed; --paper: #ffffff;
  --red: #ff2a00; --red-ink: #c42000; --indigo: #3a4098; --peri: #9caaf5;
  --line: #d9d6e6; --muted: #4f527f; --soft: #eeeaf8; --scrap: #8b8da8; --ok: #1d7a4a;
  --p1: #3a4098; --p2: #d22500; --p3: #0f7a6a; --p4: #9a6a00; --p5: #7a3a98; --p6: #1f6fb8; --p7: #b0175a; --p8: #4f6420;
  --font: "Rokkitt", Rockwell, "Roboto Slab", Georgia, serif;
  --tabbar: calc(52px + env(safe-area-inset-bottom, 0px));
  --slant: 0.7536; --s10: calc(10px * var(--slant)); --s7: calc(7px * var(--slant));
  color-scheme: light;
}
* { box-sizing: border-box }
body { background: var(--navy); color: var(--navy); font-family: var(--font); font-size: 18px; line-height: 1.3; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
.wrap { max-width: 900px; margin: 0 auto; padding-inline: 16px; padding-block: 0 110px; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-weight: 700; text-wrap: balance; line-height: 1.05; }
h1 { font-size: 34px; } h2 { font-size: 26px; } h3 { font-size: 21px; }
p { margin: 0; }
.muted { color: var(--muted); } .small { font-size: 15px; }

/* header + tabs */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--navy); border-bottom: 4px solid var(--red); }
header.top .in { max-width: 900px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 16px; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--cream); font-weight: 800; font-size: 22px; letter-spacing: .04em; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; }
.brand span { font-weight: 500; letter-spacing: .01em; color: var(--peri); }
nav.tabs { display: flex; gap: 2px; margin-left: auto; }
nav.tabs button { position: relative; isolation: isolate; display: inline-grid; align-items: baseline; font: 700 19px var(--font); color: var(--cream); background: none; border: 0; padding: 6px 8px 4px 4px; cursor: pointer; white-space: nowrap; }
nav.tabs button::before, nav.tabs button span { grid-area: 1 / 1; }
nav.tabs button span { padding-left: 1.1em; }
nav.tabs button::before { content: ""; z-index: -1; justify-self: start; width: .85em; height: .35em; background: var(--red); clip-path: polygon(var(--s7) 0, 100% 0, calc(100% - var(--s7)) 100%, 0 100%); transition: width .25s cubic-bezier(.2,.7,.3,1); }
nav.tabs button:hover::before, nav.tabs button[aria-current="true"]::before { width: calc(100% + .3em); }
nav.tabs button[aria-current="true"]::before { background: var(--indigo); }
nav.tabs .n { font-size: 14px; color: var(--peri); margin-left: 3px; }
@media (max-width: 700px) {
  .brand span { display: none; }
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; background: var(--navy); border-top: 4px solid var(--red); padding: 0 4px env(safe-area-inset-bottom, 0px); height: var(--tabbar); align-items: center; justify-content: space-around; z-index: 6; }
  nav.tabs button { font-size: 17px; padding: 6px 4px 4px; }
  nav.tabs button span { padding-left: .15em; }
  nav.tabs button::before { width: 0; }
  nav.tabs button[aria-current="true"]::before { width: calc(100% + .1em); }
  nav.tabs .n { display: none; }
}

/* panels */
section.view { display: grid; gap: 14px; padding-top: 18px; }
.panel { position: relative; background: var(--cream); color: var(--navy); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.accent::before, .accent::after { content: ""; position: absolute; width: 95px; height: 10px; pointer-events: none; }
.accent::before { top: 0; right: 0; background: var(--indigo); clip-path: polygon(var(--s10) 0, 100% 0, 100% 100%, 0 100%); }
.accent::after { bottom: 0; left: 0; background: var(--red); clip-path: polygon(0 0, 100% 0, calc(100% - var(--s10)) 100%, 0 100%); }
.on-navy { color: var(--cream); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.row > * { min-width: 0; }
.spread { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
label.f { display: grid; gap: 4px; font-size: 15px; font-weight: 700; color: var(--muted); flex: 1 1 150px; }
input, select, textarea { font: 500 18px var(--font); color: var(--navy); background: var(--paper); border: 2px solid var(--line); border-radius: 0; padding: 8px 10px; width: 100%; min-width: 0; }
input:focus, select:focus, textarea:focus { border-color: var(--indigo); outline: none; }
textarea { min-height: 110px; resize: vertical; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; font: 700 19px var(--font); line-height: 1.15; padding: 9px 16px; background: var(--paper); color: var(--navy); border: 2px solid var(--navy); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--navy); color: var(--cream); }
.btn.primary::after { content: ""; width: 8px; height: 11px; background: var(--red); flex: none; clip-path: polygon(0 0, 53% 0, 100% 50%, 53% 100%, 0 100%, 47% 50%); }
.btn.primary:hover { background: var(--indigo); }
.btn.big { font-size: 22px; padding: 12px 22px; }
.btn.danger { color: var(--red-ink); border-color: var(--red-ink); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 4px 0; font: 700 18px var(--font); color: var(--indigo); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.link.on-navy { color: var(--peri); }
button.x { border: 0; background: none; color: var(--muted); font: 700 26px var(--font); line-height: 1; padding: 4px 10px; cursor: pointer; }
button.x:hover { color: var(--red-ink); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; padding: 2px 10px; background: var(--paper); border: 2px solid var(--line); white-space: nowrap; }
.chip.ok { color: var(--ok); border-color: var(--ok); }
.chip.ind { color: var(--indigo); border-color: var(--peri); background: var(--soft); }
.banner { background: var(--soft); border-left: 8px solid var(--indigo); padding: 10px 14px; font-size: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.err { color: var(--red-ink); background: #ffe9e3; padding: 8px 12px; font-size: 16px; font-weight: 600; }
.empty { text-align: center; padding: 26px 12px; color: var(--muted); }
.toggle { display: flex; gap: 10px; align-items: center; font-size: 17px; cursor: pointer; }
.toggle input { width: 22px; height: 22px; accent-color: var(--navy); flex: none; }

/* job groups */
.ghead { display: flex; gap: 10px; align-items: center; flex: 1 1 0; min-width: 0; }
.ghead h3 { min-width: 0; overflow-wrap: anywhere; }
.gnum { font-weight: 800; font-size: 16px; color: var(--cream); background: var(--navy); padding: 1px 10px 1px 8px; clip-path: polygon(0 0, 100% 0, calc(100% - var(--s7)) 100%, 0 100%); flex: none; }
.panel.off > :not(.spread):not(.cutflag) { opacity: .5; }
.panel.off:focus-within > * { opacity: 1; }
.cutflag { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; background: var(--ok); color: #fff; padding: 8px 12px; font-size: 16px; }
.cutflag b { font-size: 19px; }
.pickers { display: grid; grid-template-columns: 1fr 1fr 110px; gap: 10px; }
@media (max-width: 560px) { .pickers { grid-template-columns: 1fr 1fr; } .pickers .barlen { grid-column: 1 / -1; } }
.pickbtn { display: grid; text-align: left; gap: 0; width: 100%; background: var(--paper); border: 2px solid var(--line); padding: 6px 10px; cursor: pointer; font-family: var(--font); color: var(--navy); min-height: 46px; }
.pickbtn:hover { border-color: var(--indigo); }
.pickbtn b { font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
.pickbtn small { font-size: 14px; color: var(--muted); }
.pickbtn.empty-pick b { color: var(--red-ink); }
.pickbox { grid-column: 1 / -1; border: 2px solid var(--indigo); background: var(--paper); padding: 10px; display: grid; gap: 8px; }
.picklist { display: grid; gap: 4px; max-height: 320px; overflow-y: auto; }
.opt { display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; background: var(--cream); border: 0; padding: 8px 10px; font: 600 18px var(--font); color: var(--navy); cursor: pointer; }
.opt:hover, .opt:focus-visible { background: var(--soft); }
.opt small { color: var(--muted); font-weight: 500; font-size: 15px; }
.opt.add { background: none; color: var(--indigo); border: 2px dashed var(--peri); }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 100px; }
.pimg { height: 52px; width: auto; max-width: 64px; object-fit: contain; background: #fff; border: 1px solid var(--line); padding: 2px; flex: none; }
.pimg.sm { height: 34px; max-width: 42px; }
.pimg.big { height: 96px; max-width: 120px; }
.fin-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.seg-ctl.fin button { font-size: 16px; padding: 6px 11px; }
.pickbtn.fixed, .pickbtn.fixed:hover { cursor: default; border-color: var(--line); }
.sw { width: 22px; height: 22px; flex: none; border: 1px solid rgba(4,4,89,.3); }
.cuts { width: 100%; border-collapse: collapse; }
.cuts th { text-align: left; font-size: 15px; color: var(--muted); font-weight: 700; padding: 4px 6px; border-bottom: 2px solid var(--line); }
.cuts td { padding: 2px 3px; border-bottom: 1px solid var(--line); }
.cuts td input { padding: 6px 7px; background: transparent; border-color: transparent; }
.cuts td input:hover { border-color: var(--line); }
.cuts .c-len { width: 32%; } .cuts .c-qty { width: 18%; } .cuts .c-x { width: 44px; text-align: right; }
.cuts td input.len { font-weight: 700; font-size: 20px; }
.addrow { display: grid; grid-template-columns: 1.3fr .8fr 1.6fr auto; gap: 8px; }
@media (max-width: 500px) { .addrow { grid-template-columns: 1fr 1fr; } .addrow .lbl, .addrow button { grid-column: 1 / -1; } }
details summary { cursor: pointer; color: var(--indigo); font-weight: 700; }
.slider { display: grid; gap: 4px; }
.slider input[type=range] { padding: 0; border: 0; background: none; accent-color: var(--red); }
.slider .ends { display: flex; justify-content: space-between; font-size: 15px; color: var(--muted); gap: 8px; }
.slider .ends b { color: var(--navy); }
/* action bar: full width, fixed to the bottom of the screen (above the tab bar on phones) */
.go { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; background: var(--navy-deep); border-top: 4px solid var(--red); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.go-in { max-width: 868px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
@media (max-width: 700px) { .go { bottom: var(--tabbar); padding-bottom: 10px; border-top-width: 3px; } }
.go .sel { color: var(--cream); font-size: 16px; }
.go.static { position: static; margin-inline: -16px; }
body:has(.go:not(.static)) .wrap { padding-bottom: 190px; }
section.view > .spread .btn, section.view > .actions .btn, .go .btn { background: var(--cream); color: var(--navy); border-color: var(--cream); }
section.view > .spread .btn:hover, section.view > .actions .btn:hover, .go .btn:hover { background: var(--paper); }
.link.danger { color: var(--red-ink); }

/* job list / history */
.card { display: grid; gap: 6px; text-align: left; width: 100%; background: var(--cream); border: 0; padding: 14px 16px; cursor: pointer; font-family: var(--font); color: var(--navy); position: relative; }
.card:hover { background: var(--paper); }
.card b { font-size: 21px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* cut sheet */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.stat { background: var(--paper); padding: 8px 10px; border-bottom: 3px solid var(--line); }
.stat b { display: block; font-size: 28px; font-weight: 800; line-height: 1; }
.stat span { font-size: 15px; color: var(--muted); }
.pattern { border-top: 2px solid var(--line); padding-top: 14px; display: grid; gap: 8px; }
.phead { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.plabel { font-size: 22px; font-weight: 800; color: var(--cream); background: var(--navy); padding: 2px 14px 2px 9px; clip-path: polygon(0 0, 100% 0, calc(100% - var(--s7)) 100%, 0 100%); align-self: center; line-height: 1.1; }
.gnum.big { font-size: 26px; padding: 2px 16px 2px 11px; }
.times { font-size: 40px; font-weight: 800; color: var(--red-ink); line-height: .9; min-width: 2.1ch; }
.src { font-size: 20px; font-weight: 700; }
.src.stock { color: var(--indigo); }
.bar { display: flex; height: 38px; overflow: hidden; background: var(--paper); border: 2px solid var(--navy); }
.seg { display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 15px; overflow: hidden; white-space: nowrap; border-right: 2px solid var(--paper); min-width: 0; }
.seg.left { color: var(--muted); border-right: 0; background: repeating-linear-gradient(135deg, var(--paper) 0 6px, #e1e0ea 6px 9px); }
.seg.left.keep { background: repeating-linear-gradient(135deg, var(--soft) 0 6px, var(--peri) 6px 9px); color: var(--indigo); }
.cl { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.cl li { display: grid; grid-template-columns: 14px 3.6ch auto 1fr; gap: 10px; align-items: baseline; }
.cl .dot { width: 14px; height: 14px; align-self: center; }
.cl .q { font-size: 24px; font-weight: 800; text-align: right; }
.cl .l { font-size: 26px; font-weight: 800; }
.cl .lab { font-size: 15px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.rest { font-size: 17px; font-weight: 700; }
.rest.keep { color: var(--indigo); } .rest.scrap { color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* stock + catalog */
.pieces { display: flex; flex-wrap: wrap; gap: 6px; }
.piece { display: inline-flex; align-items: center; font-size: 19px; font-weight: 700; background: var(--paper); border: 2px solid var(--peri); padding: 2px 2px 2px 10px; }
.piece .qty { color: var(--indigo); margin-left: 5px; }
.piece button { border: 0; background: none; color: var(--muted); cursor: pointer; font: 700 22px var(--font); padding: 0 8px; }
.piece button:hover { color: var(--red-ink); }
.seg-ctl { display: flex; border: 2px solid var(--navy); width: max-content; max-width: 100%; }
.seg-ctl button { font: 700 18px var(--font); padding: 7px 16px; border: 0; background: var(--paper); color: var(--navy); cursor: pointer; }
.seg-ctl button[aria-pressed="true"] { background: var(--navy); color: var(--cream); }
.cat { display: grid; gap: 4px; }
.cat .opt { background: var(--paper); }
.cat .opt span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.form { display: grid; gap: 10px; background: var(--paper); border: 2px solid var(--indigo); padding: 12px; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 17px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(190px + env(safe-area-inset-bottom, 0px)); background: var(--cream); color: var(--navy); border-left: 8px solid var(--red); box-shadow: 0 6px 20px rgba(0,0,0,.35); padding: 10px 16px; font-weight: 700; z-index: 10; max-width: calc(100% - 32px); }
.imp-row { display: grid; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.imp-row:last-child { border-bottom: 0; }
.imp-row.open { padding-block: 10px; }
.loading { color: var(--cream); text-align: center; padding: 60px 16px; font-size: 20px; }
</style>

<script>
// ---- Optimizer: 1D bar cutting with a simplicity weighting ----
// Material is valued in mm of fresh bar. A remnant on the shelf is worth
// KEEP_VALUE per mm, so cutting from stock is cheap and keeping a usable
// leftover gives part of its length back.
const KEEP_VALUE = 0.3;

function genPatterns(cap, lens, cnt, kerf) {
  // Returns arrays of counts (one per length) that fit in cap.
  // Each piece consumes len + kerf; the last cut needs no kerf, hence C = cap + kerf.
  const C = cap + kerf, d = lens.length, w = lens.map(l => l + kerf);
  const out = new Map();
  const add = c => { const k = c.join(','); if (!out.has(k)) out.set(k, c.slice()); };
  const zero = () => new Array(d).fill(0);
  for (let i = 0; i < d; i++) {
    if (!cnt[i]) continue;
    const n = Math.min(cnt[i], Math.floor(C / w[i]));
    if (n > 0) { const c = zero(); c[i] = n; add(c); }
  }
  for (let i = 0; i < d; i++) {
    if (!cnt[i]) continue;
    const maxA = Math.min(cnt[i], Math.floor(C / w[i]));
    for (let a = maxA; a >= 1 && a > maxA - 30; a--) {
      const rem = C - a * w[i];
      for (let j = 0; j < d; j++) {
        if (j === i || !cnt[j]) continue;
        const b = Math.min(cnt[j], Math.floor(rem / w[j]));
        if (b < 1) continue;
        const c = zero(); c[i] = a; c[j] = b; add(c);
        const rem2 = rem - b * w[j];
        let bestK = -1, bestM = 0, bestFill = 0;
        for (let k = 0; k < d; k++) {
          if (k === i || k === j || !cnt[k]) continue;
          const m = Math.min(cnt[k], Math.floor(rem2 / w[k]));
          if (m * w[k] > bestFill) { bestFill = m * w[k]; bestK = k; bestM = m; }
        }
        if (bestK >= 0) { const c3 = c.slice(); c3[bestK] = bestM; add(c3); }
      }
    }
  }
  // Best fill regardless of how many lengths (least-waste pattern), bounded search.
  const order = lens.map((_, i) => i).filter(i => cnt[i]).sort((x, y) => w[y] - w[x]);
  let best = 0, bestC = null, nodes = 0;
  const cur = zero();
  const dfs = (p, used) => {
    if (++nodes > 4000) return;
    if (used > best) { best = used; bestC = cur.slice(); }
    if (p >= order.length || best === C) return;
    const i = order[p];
    const max = Math.min(cnt[i], Math.floor((C - used) / w[i]));
    for (let n = max; n >= 0; n--) { cur[i] = n; dfs(p + 1, used + n * w[i]); if (best === C) break; }
    cur[i] = 0;
  };
  dfs(0, 0);
  if (bestC && best > 0) add(bestC);
  return [...out.values()];
}

function runGreedy(lens, demand, o, remnants, lam) {
  const cnt = demand.slice();
  const rems = remnants.map(r => ({ len: r.len, avail: r.ids.length, ids: r.ids.slice() }));
  const bars = [];
  let left = cnt.reduce((a, b) => a + b, 0);
  while (left > 0) {
    let best = null;
    const options = [{ src: 'new', len: o.barLen, value: o.barLen }];
    for (const r of rems) if (r.avail > 0) options.push({ src: 'stock', len: r.len, value: KEEP_VALUE * r.len, rem: r });
    for (const opt of options) {
      const cap = opt.len - (opt.src === 'new' ? o.trim : o.trim / 2);
      if (cap <= 0) continue;
      for (const c of genPatterns(cap, lens, cnt, o.kerf)) {
        let pieces = 0, used = 0, distinct = 0, n = 0;
        for (let i = 0; i < c.length; i++) if (c[i]) { pieces += c[i] * lens[i]; used += c[i] * (lens[i] + o.kerf); distinct++; n += c[i]; }
        const leftover = Math.max(0, cap - used);
        const keep = leftover >= o.threshold ? leftover : 0;
        const cost = opt.value - pieces - KEEP_VALUE * keep + lam * o.barLen * (distinct - 1);
        if (!best || cost < best.cost - 1e-9 || (Math.abs(cost - best.cost) < 1e-9 && n > best.n)) best = { cost, c, opt, leftover, keep, n, distinct };
      }
    }
    if (!best) break;
    const pieces = [];
    best.c.forEach((k, i) => { for (let t = 0; t < k; t++) pieces.push(lens[i]); cnt[i] -= k; left -= k; });
    let stockId = null;
    if (best.opt.src === 'stock') { best.opt.rem.avail--; stockId = best.opt.rem.ids.shift(); }
    bars.push({ src: best.opt.src, len: best.opt.len, value: best.opt.value, pieces, leftover: best.leftover, keep: best.keep > 0, distinct: best.distinct, stockId });
  }
  return { bars, unplaced: left };
}

function evalPlan(bars, o, w) {
  let cost = 0, changes = 0;
  for (const b of bars) {
    const pieces = b.pieces.reduce((a, x) => a + x, 0);
    cost += b.value - pieces - (b.keep ? KEEP_VALUE * b.leftover : 0);
    changes += b.distinct - 1;
  }
  return cost + w * o.barLen * changes;
}

// cuts: [{len, qty, label}], o: {barLen,kerf,trim,threshold,simplicity(0..100)}, remnants: [{len, id}] (one per physical piece)
function optimize(cuts, o, remnants) {
  const errors = [];
  const cap = o.barLen - o.trim;
  const byLen = new Map();
  for (const c of cuts) {
    const len = +c.len, qty = Math.round(+c.qty || 0);
    if (!(len > 0) || qty < 1) continue;
    if (len > cap) { errors.push(`${len} mm je delší než použitelná tyč (${cap} mm)`); continue; }
    if (!byLen.has(len)) byLen.set(len, { qty: 0, labels: [] });
    const e = byLen.get(len); e.qty += qty;
    for (let i = 0; i < qty; i++) e.labels.push(c.label || '');
  }
  const lens = [...byLen.keys()].sort((a, b) => b - a);
  const demand = lens.map(l => byLen.get(l).qty);
  const remMap = new Map();
  for (const r of remnants) {
    if (!remMap.has(r.len)) remMap.set(r.len, []);
    remMap.get(r.len).push(r.id);
  }
  const rems = [...remMap.entries()].map(([len, ids]) => ({ len, ids })).sort((a, b) => a.len - b.len);
  const s = Math.max(0, Math.min(100, o.simplicity)) / 100;
  const w = 0.002 + 0.5 * s * s;
  let best = null;
  for (const lam of [0, 0.005, 0.01, 0.02, 0.035, 0.05, 0.08, 0.12, 0.18, 0.25, 0.4, 0.6]) {
    const r = runGreedy(lens, demand, o, rems, lam);
    if (r.unplaced) continue;
    const score = evalPlan(r.bars, o, w);
    if (!best || score < best.score - 1e-6 || (Math.abs(score - best.score) < 1e-6 && r.bars.length < best.bars.length)) best = { score, bars: r.bars };
  }
  if (!best) return { bars: [], patterns: [], stats: null, errors: errors.concat(lens.length ? ['Nepodařilo se umístit všechny kusy'] : []) };
  // assign labels, sort pieces longest first so each length is cut in one go
  const queues = new Map(lens.map(l => [l, byLen.get(l).labels.slice()]));
  const bars = best.bars.map(b => {
    const ps = b.pieces.slice().sort((x, y) => y - x).map(len => ({ len, label: queues.get(len).shift() || '' }));
    return { src: b.src, len: b.len, stockId: b.stockId, pieces: ps, leftover: Math.floor(b.leftover), keep: b.keep, distinct: b.distinct };
  });
  // group identical bars into patterns: stock first, then most repeated
  const pmap = new Map();
  for (const b of bars) {
    const key = b.src + ':' + b.len + ':' + b.pieces.map(p => p.len).join(',');
    if (!pmap.has(key)) pmap.set(key, { key, src: b.src, len: b.len, count: 0, leftover: b.leftover, keep: b.keep, bars: [] });
    const p = pmap.get(key); p.count++; p.bars.push(b);
  }
  const patterns = [...pmap.values()].map(p => {
    const groups = [];
    p.bars[0].pieces.forEach(pc => {
      let g = groups.find(x => x.len === pc.len);
      if (!g) { g = { len: pc.len, n: 0 }; groups.push(g); }
      g.n++;
    });
    const labels = {};
    for (const b of p.bars) for (const pc of b.pieces) if (pc.label) (labels[pc.len] = labels[pc.len] || []).push(pc.label);
    groups.forEach(g => { g.labels = labels[g.len] || []; });
    return { src: p.src, len: p.len, count: p.count, leftover: p.leftover, keep: p.keep, groups, stockIds: p.bars.map(b => b.stockId).filter(Boolean) };
  }).sort((a, b) => (a.src === b.src ? b.count - a.count || b.groups.length - a.groups.length : a.src === 'stock' ? -1 : 1));
  const newBars = bars.filter(b => b.src === 'new').length;
  const stockUsed = bars.filter(b => b.src === 'stock').map(b => b.len);
  const scrap = bars.reduce((a, b) => a + (b.keep ? 0 : b.leftover), 0);
  const kept = bars.filter(b => b.keep).map(b => b.leftover);
  const piecesLen = bars.reduce((a, b) => a + b.pieces.reduce((x, p) => x + p.len, 0), 0);
  const material = newBars * o.barLen + stockUsed.reduce((a, b) => a + b, 0);
  const changes = bars.reduce((a, b) => a + b.distinct - 1, 0);
  const setup = lens.map(l => ({ len: l, qty: byLen.get(l).qty }));
  return { bars, patterns, setup, errors, stats: { newBars, stockUsed, scrap, kept, piecesLen, material, changes, pieceCount: demand.reduce((a, b) => a + b, 0) } };
}

// ---- REF2MEN "Seznam řezů" PDF import ----
// Reads the text of the PDF and returns one block per article (profile + color) with its cuts.
// Line shapes (from a REF2MEN export):
//   "Seznam řezů Zakázka: 2608282 Datum: 12.10.2026 Strana 1"
//   "550410 1701 Kří Z 60 bílá"                 article, variant, short name, color name
//   "159 / 159 / 159 /"                          color codes
//   "Číslo tyče 1 Křídlo Z60 BRID 6000 JŘ"       bar number, long name, bar length
//   "1 [01] 01 KŘÍDLO Vlevo 1346 45,0° 45,0°"    position, field, function + side, length, angles
function parseRef2men(lines) {
  const out = { order: '', customer: '', blocks: [] };
  let cur = null, expectCode = false;
  for (let i = 0; i < lines.length; i++) {
    const t = lines[i].replace(/\s+/g, ' ').trim();
    if (!t) continue;
    let m;
    if ((m = t.match(/Zakázka:\s*(\S+)/))) {
      if (!out.order) out.order = m[1];
      const next = (lines[i + 1] || '').replace(/\s+/g, ' ').trim();
      if (!out.customer && next && !/^Č\.\s?pozice/.test(next)) out.customer = next.split(' / ')[0].trim();
      continue;
    }
    if (expectCode) {
      expectCode = false;
      if (/^[\w.-]+\s*\//.test(t)) { cur.colorCode = t.replace(/\s+/g, ''); continue; }
    }
    if ((m = t.match(/^(\d{5,8})\s+(\d{2,5})\s+(.+)$/)) && !/°/.test(t)) {
      // short name and color are separate columns; the color is the last cell (see splitArticle)
      const [ozn, color] = splitArticle(lines[i], m[3]);
      cur = { article: m[1], variant: m[2], ozn, colorText: color, colorCode: '', desc: '', barLen: 0, cuts: [], line: i };
      out.blocks.push(cur);
      expectCode = true;
      continue;
    }
    if (!cur) continue;
    if ((m = t.match(/^Číslo tyče\s*\d+\s+(.+?)\s+(\d{4,5})(?:\s+\S+)?$/))) {
      if (!cur.desc) cur.desc = m[1];
      if (!cur.barLen) cur.barLen = +m[2];
      continue;
    }
    if ((m = t.match(/^(\d+)\s+\[(\d+)\]\s*(\d+)\s+(.+?)\s+(\d+(?:[.,]\d+)?)\s+(\d+(?:[.,]\d+)?)°\s+(\d+(?:[.,]\d+)?)°$/))) {
      const len = parseFloat(m[5].replace(',', '.'));
      const what = m[4].toLowerCase().replace(/^./, c => c.toUpperCase());
      const a1 = m[6].replace(',0', ''), a2 = m[7].replace(',0', '');
      cur.cuts.push({ len, pos: m[1], field: `${m[2]}/${m[3]}`, label: `P${m[1]} ${what}`, angles: `${a1}°/${a2}°` });
    }
  }
  // merge blocks of the same article + color (they can repeat across pages)
  const merged = new Map();
  for (const b of out.blocks) {
    const k = b.article + '|' + b.variant + '|' + b.colorText + '|' + b.colorCode;
    if (merged.has(k)) merged.get(k).cuts.push(...b.cuts); else merged.set(k, b);
  }
  out.blocks = [...merged.values()].filter(b => b.cuts.length);
  return out;
}
// The raw line keeps wide gaps between columns ("Kří Z 60      bílá"); use them to split name and color.
function splitArticle(raw, rest) {
  const cells = raw.trim().split(/\s{3,}|\t/).map(s => s.trim()).filter(Boolean);
  if (cells.length >= 2) {
    const color = cells[cells.length - 1];
    const ozn = rest.slice(0, rest.lastIndexOf(color)).trim();
    if (ozn) return [ozn, color];
  }
  const parts = rest.split(' ');
  return [parts.slice(0, -1).join(' '), parts[parts.length - 1]];
}

// pdf.js text items -> lines; columns further apart than ~2 characters are joined with a wide gap.
async function pdfLines(file) {
  await loadPdfJs();
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const lines = [], meta = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const tc = await page.getTextContent();
    const rows = [];
    for (const it of tc.items) {
      if (!it.str || !it.str.trim()) continue;
      const y = it.transform[5], x = it.transform[4], h = Math.abs(it.transform[3]) || 8;
      let r = rows.find(r => Math.abs(r.y - y) < h * 0.4);
      if (!r) { r = { y, h, items: [] }; rows.push(r); }
      r.items.push({ x, w: it.width, s: it.str });
    }
    rows.sort((a, b) => b.y - a.y);
    for (const r of rows) {
      r.items.sort((a, b) => a.x - b.x);
      let s = '', end = null;
      for (const it of r.items) {
        if (end !== null) s += it.x - end > r.h * 1.2 ? '     ' : (it.x - end > r.h * 0.15 ? ' ' : '');
        s += it.s; end = it.x + it.w;
      }
      lines.push(s); meta.push({ page: n, y: r.y, h: r.h, x: r.items[0].x });
    }
  }
  lines.meta = meta; lines.pdf = pdf;   // positions, so the profile pictures can be cut out later
  return lines;
}
// REF2MEN draws a small cross-section of the profile left of the article number.
// Render the page and cut that cell out: between the "Číslo artiklu" header and the color-code line, left of the number.
async function pdfProfileImages(lines, blocks) {
  if (!lines.meta || !lines.pdf) return;
  const pages = new Map();
  for (const b of blocks) {
    const m = lines.meta[b.line], hdr = lines.meta[b.line - 1], code = lines.meta[b.line + 1];
    if (!m || !hdr || hdr.page !== m.page) continue;
    try {
      if (!pages.has(m.page)) pages.set(m.page, await renderPdfPage(lines.pdf, m.page));
      const bottom = code && code.page === m.page ? code.y - code.h * 0.9 : m.y - m.h * 2.2;
      b.img = cropIcon(pages.get(m.page), hdr.x - 4, m.x - 1, hdr.y - hdr.h * 0.4, bottom);
    } catch (e) { /* a missing picture never blocks the import */ }
  }
}
async function renderPdfPage(pdf, n) {
  const page = await pdf.getPage(n), vp = page.getViewport({ scale: 4 });
  const c = document.createElement('canvas'); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
  const ctx = c.getContext('2d', { willReadFrequently: true });
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  return { ctx, vp };
}
function cropIcon({ ctx, vp }, x1, x2, yTop, yBottom) {
  const [ax, ay] = vp.convertToViewportPoint(x1, yTop), [bx, by] = vp.convertToViewportPoint(x2, yBottom);
  const sx = Math.max(0, Math.round(Math.min(ax, bx))), sy = Math.max(0, Math.round(Math.min(ay, by)));
  const w = Math.round(Math.abs(bx - ax)), h = Math.round(Math.abs(by - ay));
  if (w < 10 || h < 10) return null;
  const d = ctx.getImageData(sx, sy, w, h).data, dark = new Uint8Array(w * h), rows = new Uint32Array(h), cols = new Uint32Array(w);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const k = (y * w + x) * 4;
    if (d[k] * 0.3 + d[k + 1] * 0.59 + d[k + 2] * 0.11 < 150) { dark[y * w + x] = 1; rows[y]++; cols[x]++; }
  }
  // table borders run across the whole cell; ignore them and keep the drawing inside
  const lineR = y => rows[y] > w * 0.85, lineC = x => cols[x] > h * 0.85;
  let x0 = w, y0 = h, xm = -1, ym = -1;
  for (let y = 0; y < h; y++) if (!lineR(y)) for (let x = 0; x < w; x++) if (dark[y * w + x] && !lineC(x)) { if (x < x0) x0 = x; if (x > xm) xm = x; if (y < y0) y0 = y; if (y > ym) ym = y; }
  if (xm - x0 < 12 || ym - y0 < 12) return null;
  const pad = 4, cw = xm - x0 + 1 + 2 * pad, ch = ym - y0 + 1 + 2 * pad, k = Math.min(1, 160 / Math.max(cw, ch));
  const out = document.createElement('canvas'); out.width = Math.round(cw * k); out.height = Math.round(ch * k);
  const o = out.getContext('2d'); o.fillStyle = '#fff'; o.fillRect(0, 0, out.width, out.height);
  o.imageSmoothingQuality = 'high';
  o.drawImage(ctx.canvas, sx + x0 - pad, sy + y0 - pad, cw, ch, 0, 0, out.width, out.height);
  return out.toDataURL('image/png');
}

let pdfJsLoading = null;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve();
  const add = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Nepodařilo se načíst čtečku PDF')); document.head.appendChild(s); });
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  // The worker script runs in this page (no separate worker thread is allowed here).
  pdfJsLoading ||= add(base + 'pdf.worker.min.js').then(() => add(base + 'pdf.min.js'));
  return pdfJsLoading;
}

// ---- PDF export: A4 pages drawn on a canvas (so Czech text needs no embedded font), packed as JPEG pages ----
// White paper; color only on the cut lengths. Each length also gets its own fill pattern so it still reads in black and white.
const PRINT_COLORS = ['#1a237e', '#e53935', '#2e7d32', '#f9a825', '#8e24aa', '#1e88e5', '#6d4c41', '#ef6c00'];
const PDF_DPI = 220, MM = PDF_DPI / 25.4, PAGE_W = 210, PAGE_H = 297, MARGIN = 10, CW = PAGE_W - 2 * MARGIN;
const PFONT = 'Rokkitt, Georgia, serif';

function printPattern(ctx, i) {
  const s = Math.round(2.4 * MM), c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d'), col = PRINT_COLORS[i % 8];
  g.fillStyle = '#fff'; g.fillRect(0, 0, s, s); g.fillStyle = col; g.strokeStyle = col; g.lineWidth = s * 0.3;
  const line = (x1, y1, x2, y2) => { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); };
  const diag = flip => { for (const o of [-s, 0, s]) flip ? line(o, 0, o + s, s) : line(o, s, o + s, 0); };
  switch (i % 8) {
    case 0: g.fillRect(0, 0, s, s); break;                                                  // solid
    case 1: diag(false); break;                                                             // ////
    case 2: g.beginPath(); g.arc(s / 2, s / 2, s * 0.3, 0, 7); g.fill(); break;             // dots
    case 3: g.fillRect(0, 0, s, s * 0.5); break;                                            // ====
    case 4: g.lineWidth = s * 0.18; diag(false); diag(true); break;                         // xxxx
    case 5: diag(true); break;                                                              // \\\\
    case 6: g.fillRect(0, 0, s * 0.5, s); break;                                            // ||||
    case 7: g.fillRect(0, 0, s / 2, s / 2); g.fillRect(s / 2, s / 2, s / 2, s / 2); break;  // checker
  }
  const p = ctx.createPattern(c, 'repeat'); p.setTransform(new DOMMatrix().scale(1 / MM)); return p;
}

// Build a list of blocks {h, draw(ctx, y), keepNext}; pages are filled top to bottom without splitting a block.
function pdfBlocks(r, ctx, imgs = []) {
  const B = [], font = (w, mm) => { ctx.font = `${w} ${mm}px ${PFONT}`; };
  const text = (s, x, y, w, mm, color = '#000', align = 'left') => { font(w, mm); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y); };
  const wrap = (s, w, mm, max) => { font(400, mm); const out = []; let cur = ''; for (const word of s.split(' ')) { const t = cur ? cur + ' ' + word : word; if (ctx.measureText(t).width > max && cur) { out.push(cur); cur = word; } else cur = t; } if (cur) out.push(cur); return out; };
  const st = r.settings;
  B.push({ h: 14, draw: (c, y) => {
    text(r.name || 'Bez názvu', 0, y + 6, 700, 7);
    text(czDate(r.date), CW, y + 6, 700, 4.2, '#000', 'right');
    text(`Řez ${num(st.kerf)} mm · zaříznutí ${num(st.trim)} mm · zbytky od ${num(st.threshold)} mm · ${simpText(r.simplicity)}`, 0, y + 11, 400, 3.4, '#444');
  } });
  r.groups.forEach((gr, gi) => {
    const p = gr.plan, s = p.stats, L = gLetter(gi);
    const ci = new Map((p.setup || []).map((x, i) => [x.len, i]));
    const pat = len => printPattern(ctx, ci.get(len) ?? 0);
    const summary = s ? [`${s.newBars}× nová tyč ${num(gr.barLen)} mm`, s.stockUsed.length ? `${s.stockUsed.length}× zbytek ze skladu` : '', s.kept.length ? `${s.kept.length}× zbytek do skladu` : '',
      `odpad ${num((s.material ? (s.material - s.piecesLen - s.kept.reduce((a, b) => a + b, 0)) / s.material * 100 : 0).toFixed(1))} %`].filter(Boolean).join(' · ') : '';
    const im = imgs[gi], iw = im ? Math.min(14, 11 * im.naturalWidth / im.naturalHeight) : 0, tx = im ? 14 + iw + 2.5 : 14;
    B.push({ h: 14, keepNext: true, draw: (c, y) => {
      if (im) { c.drawImage(im, 13.5, y + 1, iw, 11); c.strokeStyle = '#999'; c.lineWidth = 0.2; c.strokeRect(13.5, y + 1, iw, 11); }
      c.fillStyle = '#000'; c.fillRect(0, y + 1.5, 11, 9);
      text(L, 5.5, y + 8.6, 800, 7, '#fff', 'center');
      text(gr.title, tx, y + 6, 700, 5);
      text([gr.sub, summary].filter(Boolean).join('  ·  '), tx, y + 10.6, 400, 3.3, '#333');
    } });
    for (const e of p.errors || []) B.push({ h: 5, draw: (c, y) => text('! ' + e, 0, y + 3.8, 700, 3.4, '#b00') });
    if (!s) return;
    p.patterns.forEach((pt, pi) => {
      const items = pt.groups.map(g => ({ g, lines: wrap(labelSummary(g.labels), 400, 3.1, CW - 36) }));
      const h = 15.6 + items.reduce((a, it) => a + Math.max(1, it.lines.length) * 4.8, 0) + 2;
      B.push({ h, draw: (c, y) => {
        c.strokeStyle = '#000'; c.lineWidth = 0.35; c.strokeRect(0.2, y + 1.2, 3.6, 3.6);      // tick box
        text(`${L}${pi + 1}`, 6, y + 4.9, 800, 5.2);
        text(`${pt.count}×`, 21, y + 4.9, 800, 5.2);
        text(pt.src === 'stock' ? `Zbytek ze skladu ${num(pt.len)} mm` : `Nová tyč ${num(pt.len)} mm`, 33, y + 4.6, 700, 3.9);
        text(pt.keep ? `Zbytek ${num(pt.leftover)} mm do skladu` : pt.leftover > 0 ? `Odpad ${num(pt.leftover)} mm` : 'Bez zbytku', CW, y + 4.6, 700, 3.5, pt.keep ? '#000' : '#555', 'right');
        // bar drawing
        const bx = 6, bw = CW - 6, by = y + 6.6, bh = 7.2;
        const segs = pt.groups.flatMap(g => Array(g.n).fill(g.len)), total = segs.reduce((a, b) => a + b, 0) + Math.max(pt.leftover, 0);
        let x = bx;
        for (const len of segs) {
          const w = len / total * bw;
          c.fillStyle = pat(len); c.fillRect(x, by, w, bh);
          font(800, 4.4); const tw = c.measureText(num(len)).width;
          if (tw + 2 < w) { c.fillStyle = '#fff'; c.fillRect(x + w / 2 - tw / 2 - 0.8, by + bh / 2 - 2.5, tw + 1.6, 5); text(num(len), x + w / 2, by + bh / 2 + 1.5, 800, 4.4, '#000', 'center'); }
          for (const [col, lw] of [['#fff', 1.6], ['#000', 0.7]]) { c.strokeStyle = col; c.lineWidth = lw; c.beginPath(); c.moveTo(x + w, by); c.lineTo(x + w, by + bh); c.stroke(); }  // white halo keeps the divider visible on any pattern
          x += w;
        }
        if (pt.leftover > 0) {
          const w = bx + bw - x;
          c.fillStyle = pt.keep ? '#fff' : '#d8d8d8'; c.fillRect(x, by, w, bh);
          font(400, 3); const lab = pt.keep ? 'sklad' : '';
          if (lab && c.measureText(lab).width + 1 < w) text(lab, x + w / 2, by + bh / 2 + 1, 400, 3, '#000', 'center');
        }
        c.strokeStyle = '#000'; c.lineWidth = 0.6; c.strokeRect(bx, by, bw, bh);
        // cut list
        let ly = by + bh + 4.8;
        for (const it of items) {
          c.fillStyle = pat(it.g.len); c.fillRect(6, ly - 3.4, 3.8, 3.8); c.strokeStyle = '#000'; c.lineWidth = 0.25; c.strokeRect(6, ly - 3.4, 3.8, 3.8);
          text(`${it.g.n}×`, 18.5, ly, 800, 4.6, '#000', 'right');
          text(num(it.g.len), 20, ly, 800, 4.6);
          (it.lines.length ? it.lines : ['']).forEach((ln, k) => text(ln, 36, ly + k * 4.8, 400, 3.1, '#333'));
          ly += Math.max(1, it.lines.length) * 4.8;
        }

    });
    B.push({ h: 9, draw: (c, y) => {
      text('Celkem:', 0, y + 4.6, 700, 3.4);
      let x = 14;
      for (const t of p.setup) {
        const lab = `${t.qty}× ${num(t.len)}`; font(700, 3.4); const w = c.measureText(lab).width;
        if (x + w + 6 > CW) break;
        c.fillStyle = pat(t.len); c.fillRect(x, y + 1.9, 3.2, 3.2); c.strokeStyle = '#000'; c.lineWidth = 0.25; c.strokeRect(x, y + 1.9, 3.2, 3.2);
        text(lab, x + 4.4, y + 4.6, 700, 3.4); x += w + 9;
      }
    } });
  });

  return B.map(b => ({ ...b, draw: (c, y) => { ctx = c; b.draw(c, y); } }));

async function pdfPages(r) {
  try { await document.fonts.load(`700 12px Rokkitt`); await document.fonts.load(`400 12px Rokkitt`); await document.fonts.load(`800 12px Rokkitt`); } catch (e) {}
  const mk = () => { const c = document.createElement('canvas'); c.width = Math.round(PAGE_W * MM); c.height = Math.round(PAGE_H * MM); const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.setTransform(MM, 0, 0, MM, MARGIN * MM, MARGIN * MM); return { c, x }; };
  const probe = mk();
  // profile pictures (from REF2MEN) next to each profile heading
  const imgs = await Promise.all(r.groups.map(gr => {
    const p = typeof P === 'function' && P(gr.group.profileId);
    if (!p || !p.img) return null;
    const im = new Image(); im.src = p.img;
    return im.decode().then(() => im, () => null);
  }));
  const blocks = pdfBlocks(r, probe.x, imgs), bottom = PAGE_H - 2 * MARGIN - 6;
  // paginate: a profile heading stays with the bar below it
  const pages = [[]]; let y = 0;
  blocks.forEach((b, i) => {
    const need = b.h + (b.keepNext && blocks[i + 1] ? blocks[i + 1].h : 0);
    if (y + need > bottom && pages[pages.length - 1].length) { pages.push([]); y = 0; }
    pages[pages.length - 1].push({ b, y }); y += b.h;
  });
  const out = [];
  for (let n = 0; n < pages.length; n++) {
    const { c, x } = n === 0 ? probe : mk();
    for (const { b, y } of pages[n]) { x.save(); b.draw(x, y); x.restore(); }
    x.font = `400 2.8px ${PFONT}`; x.fillStyle = '#666'; x.textAlign = 'right';
    x.fillText(`${r.name || ''} · ${czDate(r.date)} · strana ${n + 1}/${pages.length}`, CW, PAGE_H - 2 * MARGIN + 2);
    const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.9));
    out.push({ bytes: new Uint8Array(await blob.arrayBuffer()), w: c.width, h: c.height });
  }
  return out;
}

function buildPdf(imgs) {
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const add = x => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); len += b.length; };
  const obj = (id, body) => { offs[id] = len; add(`${id} 0 obj\n`); body(); add('\nendobj\n'); };
  add('%PDF-1.4\n%âã\n');
  obj(1, () => add('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => add(`<< /Type /Pages /Kids [${imgs.map((_, i) => `${3 + i * 3} 0 R`).join(' ')}] /Count ${imgs.length} >>`));
  imgs.forEach((im, i) => {
    const p = 3 + i * 3, cs = 'q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(p, () => add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${p + 2} 0 R >> >> /Contents ${p + 1} 0 R >>`));
    obj(p + 1, () => add(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(p + 2, () => { add(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`); add(im.bytes); add('\nendstream'); });
  });
  const xref = len, total = 3 + imgs.length * 3;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for (let i = 1; i < total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  add(x + `trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, { type: 'application/pdf' });
}

async function exportPdf(r, btn) {
  if (!r) return;
  const label = btn.textContent; btn.disabled = true; btn.textContent = 'Připravuji PDF…';
  try {
    const blob = buildPdf(await pdfPages(r));
    const filename = `Rezani ${(r.name || 'plan').replace(/[\\/:*?"<>|]+/g, ' ').trim()} ${r.date}.pdf`;
    let dl = null;
    try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) {}
    if (dl) {
      try { await dl.save({ filename, data: blob }); toast('PDF uloženo'); }
      catch (e) { if (e && e.code !== 'declined') toast('PDF se nepodařilo uložit: ' + (e.message || e.code)); }
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }
  } catch (e) { toast('PDF se nepodařilo vytvořit: ' + (e.message || e)); }
  finally { btn.disabled = false; btn.textContent = label; }
}

// Accepts "1450 4", "1450x4", "4 x 1450", "1450;4;O1", "1450 mm 4 ks", CSV with a header row.
function parseList(text) {
  const out = [];
  for (let line of text.split(/\r?\n/)) {
    line = line.trim();
    if (!line) continue;
    const nums = [...line.matchAll(/\d+(?:[.,]\d+)?/g)].map(m => ({ v: parseFloat(m[0].replace(',', '.')), s: m.index, e: m.index + m[0].length }));
    if (!nums.length) continue;
    const lenN = nums.reduce((a, b) => (b.v > a.v ? b : a));
    if (lenN.v < 20) continue;
    const qtyN = nums.filter(n => n !== lenN && Number.isInteger(n.v) && n.v > 0 && n.v < 1000)[0];
    let label = line;
    for (const n of [lenN, qtyN].filter(Boolean).sort((a, b) => b.s - a.s)) label = label.slice(0, n.s) + ' ' + label.slice(n.e);
    label = label.replace(/\b(mm|pcs|ks|kus[uyů]?|x|×)\b/gi, ' ').replace(/[;,\t|*×]+/g, ' ').replace(/\s+/g, ' ').trim();
    out.push({ id: uid(), len: lenN.v, qty: qtyN ? qtyN.v : 1, label });
  }
  return out;
}

    <div class="picklist" id="pick-list">${pickListHtml()}</div>
    <div><button class="link" data-act="close-pick">Zavřít</button></div></div>`;
}
function pickSystem() {
  if (pick.kind !== 'profiles' || pick.all) return null;
  if (pick.ctx.startsWith('g:')) { const j = curJob(); return j && j.systemId && SY(j.systemId) ? j.systemId : null; }
  if (pick.ctx.startsWith('imp:')) return imp && imp.systemId && SY(imp.systemId) ? imp.systemId : null;
  return null;
}
function pickListHtml() {
  const sys = pickSystem();
  const res = search(pick.kind, pick.q).filter(o => !sys || o.systemId === sys).slice(0, 40);
  const allLink = sys ? `<button class="link" data-act="pick-all">Zobrazit profily všech systémů</button>` : '';
  const items = res.map(o => `<button class="opt" data-act="pick" data-id="${o.id}">${pick.kind === 'colors' ? swatch(o) : pImg(o, 'pimg sm')}<span>${esc(oName(pick.kind, o))} <small>${esc(pick.kind === 'profiles' ? pSub(o) : cSub(o))}</small></span></button>`).join('');
  const add = pick.q.trim() ? `<button class="opt add" data-act="pick-add">+ Přidat „${esc(pick.q.trim())}“ do katalogu</button>` : '';
  return (items || `<div class="muted small" style="padding:6px">Nic nenalezeno.</div>`) + add + allLink;
}

const views = {
  jobs() {
    if (imp) return importView();
    const j = curJob();
    if (j) return jobEditor(j);
    const jobs = [...D.jobs.values()].sort((a, b) => (b.updated || '').localeCompare(a.updated || ''));
    return `
      ${hasExamples() ? `<div class="banner"><span>Obsahuje ukázková data (zakázka, katalog, sklad).</span><span class="actions">${confirmKey === 'ex' ? `<button class="btn danger" data-act="rm-examples">Ano, smazat ukázky</button><button class="btn" data-act="cancel">Ne</button>` : `<button class="btn" data-act="ask" data-key="ex">Smazat ukázky</button>`}</span></div>` : ''}
      <div class="spread"><h1 class="on-navy">Zakázky</h1><span class="actions">${fileBtn('Import z REF2MEN')}<button class="btn primary" data-act="new-job">Nová zakázka</button></span></div>
      ${jobs.length ? jobs.map(j => {
        const gs = j.groups || [], cut = gs.filter(g => g.cutAt).length;
        return `<button class="card" data-act="open-job" data-id="${j.id}">
          <div class="spread"><b>${esc(j.name || 'Bez názvu')}</b><span class="small muted">${czDate(j.created)}</span></div>
          <div class="small muted">${gs.length ? esc([jobSystems(j).join(', '), [...new Set(gs.filter(g => g.colorId || g.finish).filter(hasColor).map(colorLabel))].join(', ')].filter(Boolean).join(' · ')) : 'Zatím bez profilů'}</div>
          <div class="chips"><span class="chip">${gs.length} ${pl(gs.length, 'profil', 'profily', 'profilů')}</span>${cut ? `<span class="chip ok">nařezáno ${cut} z ${gs.length}</span>` : ''}</div>
        </button>`;
      }).join('') : `<div class="panel empty">Zatím žádné zakázky. Založte první tlačítkem Nová zakázka.</div>`}`;
  },

  sheet() {
    const r = ui.result;
    if (!r) return `<div class="panel empty">Zatím žádný plán. Otevřete zakázku, vyberte profily a stiskněte Spočítat plán.</div>`;
    return renderSheet(r, !r.savedId);
  },

  stock() {
    const q = ui.stockQ || '';
    const toks = norm(q).split(/\s+/).filter(Boolean);
    const groups = new Map();
    for (const s of D.stock.values()) {
      const k = s.profileId + '|' + colorKey(s);
      if (!groups.has(k)) groups.set(k, { p: P(s.profileId), c: C(s.colorId), s, items: [] });
      groups.get(k).items.push(s);
    }
    const list = [...groups.values()].filter(g => toks.every(t => norm([pName(g.p), pSub(g.p), colorLabel(g.s), cSub(g.c)].join(' ')).includes(t)))
      .sort((a, b) => (pName(a.p) + colorLabel(a.s)).localeCompare(pName(b.p) + colorLabel(b.s), 'cs'));
    const total = [...D.stock.values()].reduce((a, s) => a + s.qty, 0);
    const sf = pick && pick.ctx === 'stock';
    return `
    <div class="spread"><h1 class="on-navy">Sklad zbytků</h1><span class="chip ind">${total} ${pl(total, 'kus', 'kusy', 'kusů')}</span></div>
    <div class="panel">
      <input id="stock-q" value="${esc(q)}" placeholder="Hledat profil nebo barvu…" autocomplete="off">
      <p class="small muted">Zbytky od ${num(settings.threshold)} mm se sem přidají samy, když uložíte plán. V dalším plánu se použijí přednostně.</p>
      ${list.length ? list.map(g => `
        <div style="display:grid;gap:6px"><div style="display:flex;gap:8px;align-items:center">${pImg(g.p, 'pimg sm')}${swatchOf(g.s)}<h3>${esc(pName(g.p))} · ${esc(colorLabel(g.s))}</h3></div>
          <div class="pieces">${g.items.sort((a, b) => b.len - a.len).map(s => `<span class="piece" title="${esc(s.source)} · ${czDate(s.date)}">${num(s.len)}${s.qty > 1 ? `<span class="qty">×${s.qty}</span>` : ''}<button data-act="stock-minus" data-id="${s.id}" aria-label="Odebrat jeden kus ${num(s.len)} mm">−</button></span>`).join('')}</div>
        </div>`).join('') : `<div class="empty">${D.stock.size ? 'Nic nenalezeno.' : 'Sklad je prázdný.'}</div>`}
    </div>
    <div class="panel">
      <h3>Přidat zbytek ručně</h3>
      <div class="pickers" style="grid-template-columns:1fr 1fr">
        ${pickerHtml('stock', 'profiles', stockForm.profileId)}${colorPickHtml('stock', stockForm)}
        ${sf ? pickBoxHtml() : ''}
      </div>
      ${finishHtml('stock', stockForm)}
      <div class="row">
        <label class="f">Délka mm<input id="st-len" inputmode="decimal"></label>
        <label class="f" style="flex:0 1 110px">Kusů<input id="st-qty" inputmode="numeric" value="1"></label>
        <button class="btn primary" data-act="stock-add">Přidat do skladu</button>
      </div>
    </div>`;
  },

  history() {
    const hs = [...D.history.values()].sort((a, b) => (b.savedAt || '').localeCompare(a.savedAt || ''));
    return `<h1 class="on-navy">Historie</h1>` + (hs.length ? hs.map(h => {
      const bars = h.groups.reduce((a, g) => a + (g.plan.stats ? g.plan.stats.newBars : 0), 0);
      const kept = h.groups.flatMap(g => g.plan.stats ? g.plan.stats.kept : []);
      return `<button class="card" data-act="open-hist" data-id="${h.id}">
        <div class="spread"><b>${esc(h.name || 'Bez názvu')}</b><span class="small muted">${czDate(h.date)}</span></div>
        <div class="small muted">${h.groups.map(g => esc(g.title)).join(' / ')}</div>
        <div class="chips"><span class="chip">${bars} ${pl(bars, 'nová tyč', 'nové tyče', 'nových tyčí')}</span>${kept.length ? `<span class="chip ind">do skladu ${summarizeLens(kept)}</span>` : ''}</div>
      </button>`;
    }).join('') : `<div class="panel empty">Uložené plány se objeví tady, i s tím, co zbylo.</div>`);
  },

  catalog() {
    const kind = ui.catTab;
    if (kind === 'systems') return catalogSystems() + settingsPanels();
    const q = ui.catQ || '';
    const items = search(kind, q);
    const isP = kind === 'profiles';
    return `
    <h1 class="on-navy">Katalog</h1>
    <div class="panel">
      <div class="spread"><div class="seg-ctl" role="group" aria-label="Katalog">
${catTabs()}</div>
        <button class="btn primary" data-act="cat-new">${isP ? 'Nový profil' : 'Nová barva'}</button></div>
      ${edit && !edit.id && edit.kind === kind ? editForm() : ''}
      <input id="cat-q" value="${esc(q)}" placeholder="${isP ? 'Hledat podle názvu, systému, kódu nebo názvu z REF2MEN…' : 'Hledat podle názvu, kódu nebo povrchu…'}" autocomplete="off">
      <div class="cat">${items.map(o => edit && edit.id === o.id ? editForm() : `<button class="opt" data-act="cat-edit" data-id="${o.id}">${isP ? pImg(o, 'pimg sm') : swatch(o)}<span>${esc(oName(kind, o))} <small>${esc(isP ? pSub(o) : cSub(o))}${o.aliases && o.aliases.length ? ` · ${o.aliases.length} ${pl(o.aliases.length, 'jiný název', 'jiné názvy', 'jiných názvů')}` : ''}</small></span><small>Upravit</small></button>`).join('') ||
        `<div class="empty">${D[kind].size ? 'Nic nenalezeno.' : `Katalog je prázdný. ${isP ? 'Přidejte první profil' : 'Přidejte první barvu'} tlačítkem nahoře.`}</div>`}</div>
    </div>
    ${settingsPanels()}`;
  }
};

function settingsPanels() {
  return `
    <div class="panel">
      <h2>Pila a sklad</h2>
      <div class="row">
        <label class="f">Šířka řezu (kotouč) mm<input data-sf="kerf" inputmode="decimal" value="${num(settings.kerf)}"></label>
        <label class="f">Zaříznutí konců na tyč mm<input data-sf="trim" inputmode="decimal" value="${num(settings.trim)}"></label>
      </div>
      <div class="row">
        <label class="f">Zbytky ponechat od mm<input data-sf="threshold" inputmode="numeric" value="${num(settings.threshold)}"></label>
        <label class="f">Výchozí délka tyče mm<input data-sf="barLen" inputmode="numeric" value="${num(settings.barLen)}"></label>
      </div>
      <p class="small muted">Kratší zbytky se počítají jako odpad a do skladu se nepřidávají.</p>
    </div>
    <div class="panel">
      <h2>Data</h2>
      <p class="small muted">${mode === 'db' ? 'Katalog, sklad, zakázky a historie jsou ve sdílené databázi. Všichni, kdo mají přístup k této stránce, vidí stejná data.' : 'Data jsou uložená jen v tomto prohlížeči.'}</p>
      <div class="actions">${hasExamples() ? (confirmKey === 'ex' ? `<button class="btn danger" data-act="rm-examples">Ano, smazat ukázky</button><button class="btn" data-act="cancel">Ne</button>` : `<button class="btn" data-act="ask" data-key="ex">Smazat ukázková data</button>`) : `<button class="btn" data-act="load-examples">Načíst ukázková data</button>`}</div>
    </div>`;
}
function catTabs() {
  const k = ui.catTab;
  return `<div class="seg-ctl" role="group" aria-label="Katalog">
    <button data-act="cat-tab" data-kind="systems" aria-pressed="${k === 'systems'}">Systémy (${D.systems.size})</button>
    <button data-act="cat-tab" data-kind="profiles" aria-pressed="${k === 'profiles'}">Profily (${D.profiles.size})</button>
    <button data-act="cat-tab" data-kind="colors" aria-pressed="${k === 'colors'}">Barvy (${D.colors.size})</button></div>`;
}
function catalogSystems() {
  const list = sortedSystems();
  const count = id => [...D.profiles.values()].filter(p => p.systemId === id).length;
  return `
    <h1 class="on-navy">Katalog</h1>
    <div class="panel">
      <div class="spread">${catTabs()}<button class="btn primary" data-act="cat-new">Nový systém</button></div>
      ${edit && !edit.id && edit.kind === 'systems' ? editForm() : ''}
      <div class="cat">${list.map(s => edit && edit.id === s.id ? editForm() : `<button class="opt" data-act="cat-edit" data-id="${s.id}"><span>${esc(s.name)} <small>${count(s.id)} ${pl(count(s.id), 'profil', 'profily', 'profilů')}</small></span><small>Upravit</small></button>`).join('') || '<div class="empty">Zatím žádné systémy. Přidejte první tlačítkem nahoře.</div>'}</div>
    </div>`;
}

function editForm() {
  const isP = edit.kind === 'profiles';
  const used = edit.id ? usage(edit.kind, edit.id) : 0;
  const delBtn = edit.id ? (confirmKey === 'cat-del' ? `<span class="confirm">${used ? `Používá se ${used}×. ` : ''}Opravdu smazat?<button class="btn danger" data-act="cat-del">Smazat</button></span>` : `<button class="btn danger" data-act="ask" data-key="cat-del">Smazat</button>`) : '';
  if (edit.kind === 'systems') {
    const s = edit.id ? D.systems.get(edit.id) : { name: '' };
    return `<div class="form"><label class="f">Název systému<input id="e-name" value="${esc(s.name)}" placeholder="např. Brillant"></label>
      <div class="actions"><button class="btn primary" data-act="cat-save">Uložit</button><button class="btn" data-act="cat-cancel">Zrušit</button>${used ? (edit.id ? `<span class="small muted">Má ${used} ${pl(used, 'profil', 'profily', 'profilů')}, nelze smazat.</span>` : '') : delBtn}</div></div>`;
  }
  const o = edit.id ? D[edit.kind].get(edit.id) : (isP ? { systemId: ui.lastSystemId || null, name: '', code: '', barLen: settings.barLen, aliases: [] } : { name: '', code: '', finish: '', hex: '', aliases: [] });
  const sysSel = o.systemId || '';
  return `<div class="form">
    ${isP ? `<div class="row">
      <label class="f">Systém<select id="e-system"><option value="">— bez systému —</option>${sortedSystems().map(s => `<option value="${s.id}" ${s.id === sysSel ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}<option value="__new">+ Nový systém…</option></select>
        <input id="e-newsys" placeholder="Název nového systému" hidden style="margin-top:6px"></label>
      <label class="f">Profil<input id="e-name" value="${esc(o.name)}" placeholder="např. R72"></label>
    </div>
    <div class="row">
      <label class="f">Číslo artiklu<input id="e-code" value="${esc(o.code)}" placeholder="např. 550900"></label>
      <label class="f" style="flex:0 1 130px">Délka tyče mm<input id="e-bar" inputmode="numeric" value="${num(o.barLen || settings.barLen)}"></label>
    </div>` : `<div class="row">
      <label class="f" style="flex:2 1 200px">Název<input id="e-name" value="${esc(o.name)}" placeholder="např. Antracit"></label>
      <label class="f" style="flex:0 1 90px">Vzorek<input id="e-hex" type="color" value="${esc(o.hex || '#ffffff')}" style="height:44px;padding:2px"></label>
    </div>
    <div class="row">
      <label class="f">Kód (RAL, dekor)<input id="e-code" value="${esc(o.code)}" placeholder="např. RAL 7016"></label>
      <label class="f">Povrch<input id="e-finish" value="${esc(o.finish)}" placeholder="např. fólie oboustranně"></label>
    </div>`}
    ${isP && o.img ? `<div class="row" style="align-items:center">${pImg(o, 'pimg big')}<span class="small muted">Obrázek z REF2MEN</span><button class="link danger" data-act="img-del">Odebrat obrázek</button></div>` : ''}
    <label class="f">Jiné názvy z REF2MEN (doplní se samy při importu), jeden na řádek<textarea id="e-aliases" style="min-height:70px">${esc((o.aliases || []).join('\n'))}</textarea></label>
    <div class="actions"><button class="btn primary" data-act="cat-save">Uložit</button><button class="btn" data-act="cat-cancel">Zrušit</button>
      ${delBtn}</div>
  </div>`;
}

// The real file input sits invisibly on top of the button, so the tap lands on it directly
// (some phone apps ignore a label that only points at a hidden input).
const fileBtn = text => `<label class="btn filebtn">${text}<input type="file" id="imp-file" accept="application/pdf,.pdf" aria-label="${text}"></label>`;
function jobEditor(j) {
  const gs = j.groups || [];
  const sel = gs.filter(g => g.selected);
  const ready = sel.filter(g => g.profileId && hasColor(g) && g.cuts.some(c => c.len > 0 && c.qty > 0));
  return `
    <div><button class="link on-navy" data-act="close-job">← Všechny zakázky</button></div>
    <div class="panel accent">
      <div class="row">
        <label class="f" style="flex:3 1 220px">Název zakázky<input id="job-name" value="${esc(j.name)}" placeholder="např. 2026-114 RD Kolín"></label>
        <label class="f" style="flex:1 1 150px">Systém<select id="job-system"><option value="">— různé —</option>${sortedSystems().map(s => `<option value="${s.id}" ${s.id === j.systemId ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>
        ${confirmKey === 'job-del' ? `<span class="confirm">Smazat celou zakázku?<button class="btn danger" data-act="del-job">Smazat</button><button class="btn" data-act="cancel">Ne</button></span>` : `<button class="link danger" data-act="ask" data-key="job-del">Smazat zakázku</button>`}
      </div>
      <div class="slider">
        <label class="f" for="simp" style="flex:none">Optimalizovat na</label>
        <input type="range" id="simp" min="0" max="100" step="10" value="${j.simplicity ?? 60}">
        <div class="ends"><span>Nejméně odpadu</span><b id="simp-lbl">${simpText(j.simplicity ?? 60)}</b><span>Nejjednodušší řezání</span></div>
      </div>
    </div>
    ${gs.map((g, gi) => groupPanel(g, gi)).join('')}
    <div class="actions"><button class="btn" data-act="add-group">+ Přidat profil</button>${fileBtn('+ Přidat z REF2MEN PDF')}</div>
    ${gs.length ? `<div class="go ${pick ? 'static' : ''}"><div class="go-in">
      <button class="btn primary big" data-act="optimize" ${ready.length ? '' : 'disabled'}>Spočítat plán</button>
      <span class="sel">${sel.length === gs.length ? 'všechny profily' : `vybráno ${sel.length} z ${gs.length}`}${ready.length < sel.length ? ` · ${sel.length - ready.length} bez profilu, barvy nebo délek` : ''}</span>
      <span style="margin-left:auto;display:flex;gap:12px"><button class="link on-navy" data-act="sel-all">Vybrat vše</button><button class="link on-navy" data-act="sel-none">Nic</button></span>
    </div></div>` : ''}`;
}

function groupPanel(g, gi) {
  const p = P(g.profileId);
  const avail = g.profileId && hasColor(g) ? stockFor(g) : [];
  const totalQty = g.cuts.reduce((a, x) => a + (+x.qty || 0), 0);
  const ctx = 'g:' + g.id;
  const open = pick && pick.ctx === ctx;
  return `
  <div class="panel ${g.selected ? '' : 'off'}" data-g="${g.id}">
    <div class="spread" style="flex-wrap:nowrap;align-items:flex-start">
      <label class="ghead toggle"><input type="checkbox" data-gf="selected" ${g.selected ? 'checked' : ''} aria-label="Zahrnout do plánu"><span class="gnum">${gi + 1}</span>${pImg(p, 'pimg sm')}<h3>${p ? esc(pShort(p, curJob())) : 'Nový profil'}${hasColor(g) ? ' · ' + esc(colorLabel(g)) : ''}</h3></label>
      <button class="x" data-act="del-group" aria-label="Odebrat profil ze zakázky">×</button>
    </div>
    ${g.cutAt ? `<div class="cutflag"><b>✓ Nařezáno ${czDate(g.cutAt)}</b>${g.selected ? '<span>Znovu vybráno do plánu</span>' : '<span>Proto není vybráno pro nový plán. Zaškrtnutím ho vyberete znovu.</span>'}</div>` : g.selected ? '' : '<div class="small muted offnote">Nevybráno, do plánu se nezapočítá.</div>'}
    <div class="pickers">
      ${pickerHtml(ctx, 'profiles', g.profileId)}${colorPickHtml(ctx, g)}
      <label class="f barlen">Tyč mm<input inputmode="numeric" data-gf="barLen" value="${num(g.barLen)}"></label>
      ${open ? pickBoxHtml() : ''}
    </div>
    ${finishHtml(ctx, g)}
    ${g.cuts.length ? `<div style="overflow-x:auto"><table class="cuts">
      <thead><tr><th class="c-len">Délka mm</th><th class="c-qty">Kusů</th><th>Popis</th><th class="c-x"></th></tr></thead>
      <tbody>${g.cuts.map(x => `<tr data-c="${x.id}">
        <td><input class="len" inputmode="decimal" data-cf="len" value="${num(x.len)}" aria-label="Délka"></td>
        <td><input inputmode="numeric" data-cf="qty" value="${x.qty}" aria-label="Počet kusů"></td>
        <td><input data-cf="label" value="${esc(x.label)}" aria-label="Popis"></td>
        <td class="c-x"><button class="x" data-act="del-cut" aria-label="Odebrat řádek">×</button></td></tr>`).join('')}</tbody>
    </table></div>
    <div class="small muted">${g.cuts.length} ${pl(g.cuts.length, 'délka', 'délky', 'délek')}, ${totalQty} ${pl(totalQty, 'kus', 'kusy', 'kusů')}</div>` : ''}
    <div class="addrow">
      <input id="add-len-${g.id}" inputmode="decimal" placeholder="Délka mm" aria-label="Nová délka">
      <input id="add-qty-${g.id}" inputmode="numeric" placeholder="Kusů" aria-label="Počet kusů">
      <input class="lbl" id="add-lbl-${g.id}" placeholder="Popis (nepovinné)" aria-label="Popis">
      <button class="btn" data-act="add-cut">Přidat</button>
    </div>
    <details><summary>Vložit seznam</summary>
      <div style="display:grid;gap:8px;margin-top:8px">
        <textarea id="paste-${g.id}" placeholder="Jeden řez na řádek, např.&#10;1450 4 O1 boky&#10;4 x 1320&#10;2100;2;Dveře"></textarea>
        <div><button class="btn" data-act="paste">Přidat řádky</button></div>
      </div>
    </details>
    <label class="toggle"><input type="checkbox" data-gf="useStock" ${g.useStock ? 'checked' : ''}>
      <span>Použít zbytky ze skladu <span class="muted small">${!g.profileId || !hasColor(g) ? '' : avail.length ? `(${avail.length} ${pl(avail.length, 'vhodný', 'vhodné', 'vhodných')}: ${summarizeLens(avail.map(a => a.len))})` : '(žádné vhodné)'}</span></span></label>
  </div>`;
}

function renderSheet(r, live) {
  return `
  <div class="panel accent">
    <div class="spread"><h1>${esc(r.name || 'Bez názvu')}</h1><span class="muted">${czDate(r.date)}</span></div>
    <div class="small muted">Řez ${num(r.settings.kerf)} mm · zaříznutí ${num(r.settings.trim)} mm · zbytky od ${num(r.settings.threshold)} mm · ${simpText(r.simplicity)}</div>
    ${r.savedId ? `<div class="chips"><span class="chip ok">Uloženo v historii</span></div>` : ''}

    const scrapPct = st.material ? (st.material - st.piecesLen - st.kept.reduce((a, b) => a + b, 0)) / st.material * 100 : 0;
    const ci = new Map(p.setup.map((s, i) => [s.len, i % 8 + 1]));
