<title>Duvox Řezání</title>
<meta name="theme-color" content="#040459">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rokkitt:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: Duvox look (navy ground, cream panels, red + indigo 37° slants, Rokkitt). One column, sticky navy header, tab bar at the bottom on phones. Single committed light-on-navy look. */
:root {
  --navy: #040459; --navy-deep: #070746; --cream: #f9f6ed; --paper: #ffffff;
  --red: #ff2a00; --red-ink: #c42000; --indigo: #3a4098; --peri: #9caaf5;
  --line: #d9d6e6; --muted: #4f527f; --soft: #eeeaf8; --scrap: #8b8da8; --ok: #1d7a4a;
  --p1: #3a4098; --p2: #d22500; --p3: #0f7a6a; --p4: #9a6a00; --p5: #7a3a98; --p6: #1f6fb8; --p7: #b0175a; --p8: #4f6420;
  --font: "Rokkitt", Rockwell, "Roboto Slab", Georgia, serif;
  --tabbar: calc(52px + env(safe-area-inset-bottom, 0px));
  --slant: 0.7536; --s10: calc(10px * var(--slant)); --s7: calc(7px * var(--slant));
  color-scheme: light;
}
* { box-sizing: border-box }
body { margin: 0; background: var(--navy); color: var(--navy); font-family: var(--font); font-size: 18px; line-height: 1.3; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
.wrap { max-width: 900px; margin: 0 auto; padding-inline: 16px; padding-block: 0 110px; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-weight: 700; text-wrap: balance; line-height: 1.05; }
h1 { font-size: 34px; } h2 { font-size: 26px; } h3 { font-size: 21px; }
p { margin: 0; }
.muted { color: var(--muted); } .small { font-size: 15px; }

/* header + tabs */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--navy); border-bottom: 4px solid var(--red); }
header.top .in { max-width: 900px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 16px; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--cream); font-weight: 800; font-size: 22px; letter-spacing: .04em; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; }
.brand span { font-weight: 500; letter-spacing: .01em; color: var(--peri); }
nav.tabs { display: flex; gap: 2px; margin-left: auto; }
nav.tabs button { position: relative; isolation: isolate; display: inline-grid; align-items: baseline; font: 700 19px var(--font); color: var(--cream); background: none; border: 0; padding: 6px 8px 4px 4px; cursor: pointer; white-space: nowrap; }
nav.tabs button::before, nav.tabs button span { grid-area: 1 / 1; }
nav.tabs button span { padding-left: 1.1em; }
nav.tabs button::before { content: ""; z-index: -1; justify-self: start; width: .85em; height: .35em; background: var(--red); clip-path: polygon(var(--s7) 0, 100% 0, calc(100% - var(--s7)) 100%, 0 100%); transition: width .25s cubic-bezier(.2,.7,.3,1); }
nav.tabs button:hover::before, nav.tabs button[aria-current="true"]::before { width: calc(100% + .3em); }
nav.tabs button[aria-current="true"]::before { background: var(--indigo); }
nav.tabs .n { font-size: 14px; color: var(--peri); margin-left: 3px; }
@media (max-width: 700px) {
  .brand span { display: none; }
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; background: var(--navy); border-top: 4px solid var(--red); padding: 0 4px env(safe-area-inset-bottom, 0px); height: var(--tabbar); align-items: center; justify-content: space-around; z-index: 6; }
  nav.tabs button { font-size: 17px; padding: 6px 4px 4px; }
  nav.tabs button span { padding-left: .15em; }
  nav.tabs button::before { width: 0; }
  nav.tabs button[aria-current="true"]::before { width: calc(100% + .1em); }
  nav.tabs .n { display: none; }
}

/* panels */
section.view { display: grid; gap: 14px; padding-top: 18px; }
.panel { position: relative; background: var(--cream); color: var(--navy); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.accent::before, .accent::after { content: ""; position: absolute; width: 95px; height: 10px; pointer-events: none; }
.accent::before { top: 0; right: 0; background: var(--indigo); clip-path: polygon(var(--s10) 0, 100% 0, 100% 100%, 0 100%); }
.accent::after { bottom: 0; left: 0; background: var(--red); clip-path: polygon(0 0, 100% 0, calc(100% - var(--s10)) 100%, 0 100%); }
.on-navy { color: var(--cream); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.row > * { min-width: 0; }
.spread { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
label.f { display: grid; gap: 4px; font-size: 15px; font-weight: 700; color: var(--muted); flex: 1 1 150px; }
input, select, textarea { font: 500 18px var(--font); color: var(--navy); background: var(--paper); border: 2px solid var(--line); border-radius: 0; padding: 8px 10px; width: 100%; min-width: 0; }
input:focus, select:focus, textarea:focus { border-color: var(--indigo); outline: none; }
textarea { min-height: 110px; resize: vertical; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; font: 700 19px var(--font); line-height: 1.15; padding: 9px 16px; background: var(--paper); color: var(--navy); border: 2px solid var(--navy); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--navy); color: var(--cream); }
.btn.primary::after { content: ""; width: 8px; height: 11px; background: var(--red); flex: none; clip-path: polygon(0 0, 53% 0, 100% 50%, 53% 100%, 0 100%, 47% 50%); }
.btn.primary:hover { background: var(--indigo); }
.btn.big { font-size: 22px; padding: 12px 22px; }
.btn.danger { color: var(--red-ink); border-color: var(--red-ink); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 4px 0; font: 700 18px var(--font); color: var(--indigo); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.link.on-navy { color: var(--peri); }
button.x { border: 0; background: none; color: var(--muted); font: 700 26px var(--font); line-height: 1; padding: 4px 10px; cursor: pointer; }
button.x:hover { color: var(--red-ink); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; padding: 2px 10px; background: var(--paper); border: 2px solid var(--line); white-space: nowrap; }
.chip.ok { color: var(--ok); border-color: var(--ok); }
.chip.ind { color: var(--indigo); border-color: var(--peri); background: var(--soft); }
.banner { background: var(--soft); border-left: 8px solid var(--indigo); padding: 10px 14px; font-size: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.err { color: var(--red-ink); background: #ffe9e3; padding: 8px 12px; font-size: 16px; font-weight: 600; }
.empty { text-align: center; padding: 26px 12px; color: var(--muted); }
.toggle { display: flex; gap: 10px; align-items: center; font-size: 17px; cursor: pointer; }
.toggle input { width: 22px; height: 22px; accent-color: var(--navy); flex: none; }

/* job groups */
.ghead { display: flex; gap: 10px; align-items: center; flex: 1 1 0; min-width: 0; }
.ghead h3 { min-width: 0; overflow-wrap: anywhere; }
.gnum { font-weight: 800; font-size: 16px; color: var(--cream); background: var(--navy); padding: 1px 10px 1px 8px; clip-path: polygon(0 0, 100% 0, calc(100% - var(--s7)) 100%, 0 100%); flex: none; }
.panel.off > :not(.spread):not(.cutflag) { opacity: .5; }
.panel.off:focus-within > * { opacity: 1; }
.cutflag { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; background: var(--ok); color: #fff; padding: 8px 12px; font-size: 16px; }
.cutflag b { font-size: 19px; }
.pickers { display: grid; grid-template-columns: 1fr 1fr 110px; gap: 10px; }
@media (max-width: 560px) { .pickers { grid-template-columns: 1fr 1fr; } .pickers .barlen { grid-column: 1 / -1; } }
.pickbtn { display: grid; text-align: left; gap: 0; width: 100%; background: var(--paper); border: 2px solid var(--line); padding: 6px 10px; cursor: pointer; font-family: var(--font); color: var(--navy); min-height: 46px; }
.pickbtn:hover { border-color: var(--indigo); }
.pickbtn b { font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
.pickbtn small { font-size: 14px; color: var(--muted); }
.pickbtn.empty-pick b { color: var(--red-ink); }
.pickbox { grid-column: 1 / -1; border: 2px solid var(--indigo); background: var(--paper); padding: 10px; display: grid; gap: 8px; }
.picklist { display: grid; gap: 4px; max-height: 320px; overflow-y: auto; }
.opt { display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; background: var(--cream); border: 0; padding: 8px 10px; font: 600 18px var(--font); color: var(--navy); cursor: pointer; }
.opt:hover, .opt:focus-visible { background: var(--soft); }
.opt small { color: var(--muted); font-weight: 500; font-size: 15px; }
.opt.add { background: none; color: var(--indigo); border: 2px dashed var(--peri); }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 100px; }
.pimg { height: 52px; width: auto; max-width: 64px; object-fit: contain; background: #fff; border: 1px solid var(--line); padding: 2px; flex: none; }
.pimg.sm { height: 34px; max-width: 42px; }
.pimg.big { height: 96px; max-width: 120px; }
.fin-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.seg-ctl.fin button { font-size: 16px; padding: 6px 11px; }
.pickbtn.fixed, .pickbtn.fixed:hover { cursor: default; border-color: var(--line); }
.sw { width: 22px; height: 22px; flex: none; border: 1px solid rgba(4,4,89,.3); }
.cuts { width: 100%; border-collapse: collapse; }
.cuts th { text-align: left; font-size: 15px; color: var(--muted); font-weight: 700; padding: 4px 6px; border-bottom: 2px solid var(--line); }
.cuts td { padding: 2px 3px; border-bottom: 1px solid var(--line); }
.cuts td input { padding: 6px 7px; background: transparent; border-color: transparent; }
.cuts td input:hover { border-color: var(--line); }
.cuts .c-len { width: 32%; } .cuts .c-qty { width: 18%; } .cuts .c-x { width: 44px; text-align: right; }
.cuts td input.len { font-weight: 700; font-size: 20px; }
.addrow { display: grid; grid-template-columns: 1.3fr .8fr 1.6fr auto; gap: 8px; }
@media (max-width: 500px) { .addrow { grid-template-columns: 1fr 1fr; } .addrow .lbl, .addrow button { grid-column: 1 / -1; } }
details summary { cursor: pointer; color: var(--indigo); font-weight: 700; }
.slider { display: grid; gap: 4px; }
.slider input[type=range] { padding: 0; border: 0; background: none; accent-color: var(--red); }
.slider .ends { display: flex; justify-content: space-between; font-size: 15px; color: var(--muted); gap: 8px; }
.slider .ends b { color: var(--navy); }
/* action bar: full width, fixed to the bottom of the screen (above the tab bar on phones) */
.go { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; background: var(--navy-deep); border-top: 4px solid var(--red); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.go-in { max-width: 868px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
@media (max-width: 700px) { .go { bottom: var(--tabbar); padding-bottom: 10px; border-top-width: 3px; } }
.go .sel { color: var(--cream); font-size: 16px; }
.go.static { position: static; margin-inline: -16px; }
body:has(.go:not(.static)) .wrap { padding-bottom: 190px; }
section.view > .spread .btn, section.view > .actions .btn, .go .btn { background: var(--cream); color: var(--navy); border-color: var(--cream); }
section.view > .spread .btn:hover, section.view > .actions .btn:hover, .go .btn:hover { background: var(--paper); }
.link.danger { color: var(--red-ink); }

/* job list / history */
.card { display: grid; gap: 6px; text-align: left; width: 100%; background: var(--cream); border: 0; padding: 14px 16px; cursor: pointer; font-family: var(--font); color: var(--navy); position: relative; }
.card:hover { background: var(--paper); }
.card b { font-size: 21px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* cut sheet */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.stat { background: var(--paper); padding: 8px 10px; border-bottom: 3px solid var(--line); }
.stat b { display: block; font-size: 28px; font-weight: 800; line-height: 1; }
.stat span { font-size: 15px; color: var(--muted); }
.pattern { border-top: 2px solid var(--line); padding-top: 14px; display: grid; gap: 8px; }
.phead { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.plabel { font-size: 22px; font-weight: 800; color: var(--cream); background: var(--navy); padding: 2px 14px 2px 9px; clip-path: polygon(0 0, 100% 0, calc(100% - var(--s7)) 100%, 0 100%); align-self: center; line-height: 1.1; }
.gnum.big { font-size: 26px; padding: 2px 16px 2px 11px; }
.times { font-size: 40px; font-weight: 800; color: var(--red-ink); line-height: .9; min-width: 2.1ch; }
.src { font-size: 20px; font-weight: 700; }
.src.stock { color: var(--indigo); }
.bar { display: flex; height: 38px; overflow: hidden; background: var(--paper); border: 2px solid var(--navy); }
.seg { display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 15px; overflow: hidden; white-space: nowrap; border-right: 2px solid var(--paper); min-width: 0; }
.seg.left { color: var(--muted); border-right: 0; background: repeating-linear-gradient(135deg, var(--paper) 0 6px, #e1e0ea 6px 9px); }
.seg.left.keep { background: repeating-linear-gradient(135deg, var(--soft) 0 6px, var(--peri) 6px 9px); color: var(--indigo); }
.cl { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.cl li { display: grid; grid-template-columns: 14px 3.6ch auto 1fr; gap: 10px; align-items: baseline; }
.cl .dot { width: 14px; height: 14px; align-self: center; }
.cl .q { font-size: 24px; font-weight: 800; text-align: right; }
.cl .l { font-size: 26px; font-weight: 800; }
.cl .lab { font-size: 15px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.rest { font-size: 17px; font-weight: 700; }
.rest.keep { color: var(--indigo); } .rest.scrap { color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* stock + catalog */
.pieces { display: flex; flex-wrap: wrap; gap: 6px; }
.piece { display: inline-flex; align-items: center; font-size: 19px; font-weight: 700; background: var(--paper); border: 2px solid var(--peri); padding: 2px 2px 2px 10px; }
.piece .qty { color: var(--indigo); margin-left: 5px; }
.piece button { border: 0; background: none; color: var(--muted); cursor: pointer; font: 700 22px var(--font); padding: 0 8px; }
.piece button:hover { color: var(--red-ink); }
.seg-ctl { display: flex; border: 2px solid var(--navy); width: max-content; max-width: 100%; }
.seg-ctl button { font: 700 18px var(--font); padding: 7px 16px; border: 0; background: var(--paper); color: var(--navy); cursor: pointer; }
.seg-ctl button[aria-pressed="true"] { background: var(--navy); color: var(--cream); }
.cat { display: grid; gap: 4px; }
.cat .opt { background: var(--paper); }
.cat .opt span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.form { display: grid; gap: 10px; background: var(--paper); border: 2px solid var(--indigo); padding: 12px; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 17px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(190px + env(safe-area-inset-bottom, 0px)); background: var(--cream); color: var(--navy); border-left: 8px solid var(--red); box-shadow: 0 6px 20px rgba(0,0,0,.35); padding: 10px 16px; font-weight: 700; z-index: 10; max-width: calc(100% - 32px); }
.imp-row { display: grid; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.imp-row:last-child { border-bottom: 0; }
.imp-row.open { padding-block: 10px; }
.loading { color: var(--cream); text-align: center; padding: 60px 16px; font-size: 20px; }
</style>

<header class="top"><div class="in">
  <div class="brand"><svg viewBox="75 101 875 822" aria-hidden="true"><path fill="currentColor" d="M808.18,184.57c-14.72-10.99-30.63-21.1-47.790-30.3c-65.73-35.21-152.12-52.8-259.16-52.8H75.88v83.1H180.1 v654.92H75.88v83.1h428.16c107.06,0,192.96-17.36,257.74-52.11c17.86-9.57,34.36-20.2,49.58-31.81l-515.76,0.83V184.57H808.18z"/><path fill="currentColor" d="M456.23,651.78l-70.23,93.44h507.83c3.58-6.23,7.01-12.58,10.21-19.11c11.420-23.38,20.66-48.17,27.74-74.33 H456.23z"/><path fill="currentColor" d="M386.01,558.75h561.38c1.14-14.98,1.72-30.31,1.72-46.02c0-16.2-0.63-31.99-1.84-47.42H456.23L386.01,558.75z"/><path fill="currentColor" d="M386.01,371.46h545.16c-7-25.35-16.03-49.39-27.12-72.11c-3.57-7.3-7.41-14.4-11.48-21.33H456.23L386.01,371.46 z"/></svg>DUVOX <span>řezání</span></div>
  <nav class="tabs" id="tabs">
    <button data-tab="jobs"><span>Zakázky</span></button>
    <button data-tab="sheet"><span>Plán</span></button>
    <button data-tab="stock"><span>Sklad<i class="n" id="n-stock"></i></span></button>
    <button data-tab="history"><span>Historie</span></button>
    <button data-tab="catalog"><span>Katalog</span></button>
  </nav>
</div></header>
<main class="wrap" id="app"><div class="loading">Načítám data…</div></main>
<div class="toast" id="toast" hidden></div>
